spring:
  security:
    oauth2:
      client:
        registration:
          auth0:
            provider: auth0
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          auth0:
            issuer-uri: ${BASE_URL}/

server:
  port: 4000